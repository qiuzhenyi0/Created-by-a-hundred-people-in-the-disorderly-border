<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>粒子軌跡 · MediaPipe</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --brown:#5c3a3a;
  --brown-lt:#7a5050;
  --blue:#a8c8d0;
  --blue-dk:#7aabb5;
  --cream:#e8dfd0;
}
body {
  background: var(--cream);
  font-family: Georgia, serif;
  overflow: hidden;
  width: 100vw; height: 100vh;
}

#camera-bg {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
  display: none;
}

#canvas {
  position: fixed; inset: 0;
  z-index: 10;
}

#finger-cursor {
  position: fixed;
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 2px solid var(--blue-dk);
  background: rgba(122,171,181,.25);
  transform: translate(-50%, -50%);
  pointer-events:none;
  display:none;
}

#finger-cursor.draw {
  border-color: var(--brown-lt);
  background: rgba(92,58,58,.3);
}
</style>
</head>

<body>

<video id="camera-bg" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="finger-cursor"></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const cursor = document.getElementById('finger-cursor');

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
window.addEventListener('resize', resize);

/* ───── state ───── */
let fingerPos=null, prevFinger=null;
let isPinching=false, prevPinch=false;

const particles=[];
const driftDots=[];
const solidLines=[];
let solidPath=[];

/* 5 秒粒子 */
class Particle {
  constructor(x,y){
    const a=Math.random()*Math.PI*2;
    const spd=0.5+Math.random()*1.8;

    this.x=x+(Math.random()-0.5)*12;
    this.y=y+(Math.random()-0.5)*12;

    this.vx=Math.cos(a)*spd;
    this.vy=Math.sin(a)*spd-0.5;

    this.r=2.5+Math.random()*3.5;

    this.life=1;
    this.decay=0.0033; // ≈5秒

    this.col=Math.random()<0.6 ? "#7aabb5" : "#8a6060";
  }

  update(){
    this.x+=this.vx;
    this.y+=this.vy;
    this.vy+=0.03;
    this.life-=this.decay;
  }

  draw(){
    const r=this.r*this.life;
    if(r<=0) return;

    ctx.globalAlpha=Math.max(0,this.life*1.1);
    ctx.fillStyle=this.col;

    ctx.beginPath();
    ctx.arc(this.x,this.y,r,0,Math.PI*2);
    ctx.fill();
  }
}

/* hover 虛線（棕色） */
function drawDrift(){
  if(driftDots.length<2) return;

  ctx.save();
  ctx.strokeStyle="#5c3a3a"; // 棕色
  ctx.lineWidth=1.5;
  ctx.setLineDash([5,8]);

  for(let i=1;i<driftDots.length;i++){
    const a=driftDots[i-1], b=driftDots[i];
    ctx.globalAlpha=0.6;
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);
    ctx.stroke();
  }
  ctx.restore();
}

/* 實線（藍色） */
function drawSolid(live=true){
  ctx.save();
  ctx.strokeStyle="#7aabb5"; // 藍色
  ctx.lineWidth=2.8;
  ctx.lineCap="round";

  for(const line of solidLines){
    ctx.beginPath();
    ctx.moveTo(line[0].x,line[0].y);
    for(let i=1;i<line.length;i++){
      ctx.lineTo(line[i].x,line[i].y);
    }
    ctx.stroke();
  }

  if(live && isPinching && solidPath.length>1){
    ctx.beginPath();
    ctx.moveTo(solidPath[0].x,solidPath[0].y);
    for(let i=1;i<solidPath.length;i++){
      ctx.lineTo(solidPath[i].x,solidPath[i].y);
    }
    ctx.stroke();
  }

  ctx.restore();
}

/* MediaPipe */
async function init(){
  const hands=new Hands({
    locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
  });

  hands.setOptions({
    maxNumHands:1,
    minDetectionConfidence:0.7,
    minTrackingConfidence:0.6
  });

  hands.onResults(onResults);

  const stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:"user"}
  });

  const video=document.getElementById("camera-bg");
  video.srcObject=stream;
  video.style.display="block";

  const camera=new Camera(video,{
    onFrame:async()=>hands.send({image:video}),
    width:640,height:480
  });

  await camera.start();
  loop();
}

/* 手勢 */
function onResults(results){
  if(!results.multiHandLandmarks?.length){
    fingerPos=null;
    isPinching=false;
    cursor.style.display="none";
    return;
  }

  const lm=results.multiHandLandmarks[0];
  const index=lm[8], thumb=lm[4];

  const ix=(1-index.x)*innerWidth;
  const iy=index.y*innerHeight;

  const dist=Math.hypot(thumb.x-index.x,thumb.y-index.y);
  isPinching=dist<0.07;

  prevFinger=fingerPos?{...fingerPos}:null;
  fingerPos={x:ix,y:iy};

  cursor.style.display="block";
  cursor.style.left=ix+"px";
  cursor.style.top=iy+"px";
  cursor.classList.toggle("draw",isPinching);

  if(isPinching){
    if(!prevPinch) solidPath=[{x:ix,y:iy}];
    else solidPath.push({x:ix,y:iy});
  }else{
    if(prevPinch && solidPath.length>1){
      solidLines.push([...solidPath]);
      solidPath=[];
    }

    if(prevFinger){
      particles.push(...Array(8).fill().map(()=>new Particle(ix,iy)));

      driftDots.push({x:ix,y:iy,age:0});
    }
  }

  prevPinch=isPinching;
}

/* loop */
function loop(){
  requestAnimationFrame(loop);
  ctx.clearRect(0,0,canvas.width,canvas.height);

  drawDrift();

  for(let i=particles.length-1;i>=0;i--){
    particles[i].update();
    if(particles[i].life<=0){
      particles.splice(i,1);
      continue;
    }
    particles[i].draw();
  }

  drawSolid(true);
}

init();
</script>

</body>
</html>
