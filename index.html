<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hand Gesture Particle Symphony - Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { background: #000; overflow: hidden; width: 100%; height: 100%; }
        #ui-layer {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 10;
            padding: 16px 20px; pointer-events: none;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        #switch-btn {
            pointer-events: auto;
            padding: 10px 28px; border-radius: 30px; border: none;
            background: rgba(255,255,255,0.88);
            font-weight: 700; font-size: 15px; cursor: pointer;
            box-shadow: 0 2px 16px rgba(0,0,0,0.4);
            letter-spacing: 0.5px;
        }
        #mode-label {
            color: #fff; font-family: 'Courier New', monospace;
            font-size: 16px; text-shadow: 0 0 12px rgba(0,255,200,0.8);
            letter-spacing: 1px;
        }
        #gesture-hint {
            color: rgba(255,255,255,0.55); font-family: 'Courier New', monospace;
            font-size: 13px; font-style: italic; text-align: center;
        }
        #loading-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; color: #fff; font-family: 'Courier New', monospace; gap: 16px;
        }
        #loading-overlay .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #0ff; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div class="spinner"></div>
    <div>核心模組載入中...</div>
</div>

<div id="ui-layer">
    <button id="switch-btn" onclick="toggleMode()">切換模式 / Switch Mode</button>
    <div id="mode-label">⊹ 心型紋樣 Rose Pattern ⊹</div>
    <div id="gesture-hint">握拳聚合 | 張手散開 | 五指併攏清除筆跡<br>彈指觸發特別卡片</div>
</div>

<script>
// ─── 全域狀態 ────────────────────────────────────────────────
let mode = 0; 
let video;
let particles = [];
const NUM_PARTICLES = 800;

let handX = 0, handY = 0;
let isFist = false;
let isHandVisible = false;

// 擴展功能變數
let trail = [];
let snapDetected = false;
let prevPinchDist = 1;
let showCard = false;
let cardTimer = 0;

let roseTargets = [];
let liminalTargets = [];
let targetsReady = false;

const MODE_INFO = [
    {
        label: "⊹ 心型紋樣 Rose Pattern ⊹",
        bg: [150, 20, 50, 110],
        glow: [255, 150, 180],
        core: [255, 80, 120]
    },
    {
        label: "失序邊境 .𖥔 ݁˖ The Liminal Veil .⋆",
        bg: [0, 8, 20, 170],
        glow: [0, 255, 220],
        core: [200, 255, 255]
    }
];

// ─── 切換模式 ─────────────────────────────────────────────────
function toggleMode() {
    mode = (mode + 1) % 2;
    document.getElementById('mode-label').innerText = MODE_INFO[mode].label;
    respawnParticles();
}

// ─── p5 setup ────────────────────────────────────────────────────
function setup() {
    createCanvas(windowWidth, windowHeight);
    video = createCapture(VIDEO, () => {
        initMediaPipe();
    });
    video.size(320, 240);
    video.hide();
}

function buildTargets() {
    roseTargets = buildRoseTargets(NUM_PARTICLES);
    liminalTargets = buildLiminalTargets(NUM_PARTICLES);
    targetsReady = true;
    respawnParticles();
}

function buildRoseTargets(n) {
    let pts = [];
    const cx = width / 2, cy = height / 2;
    for (let i = 0; i < n * 0.6; i++) {
        let t = map(i, 0, n * 0.6, 0, TWO_PI * 3);
        let r = 130 * cos(3 * t);
        pts.push({ x: cx + r * cos(t), y: cy + r * sin(t) });
    }
    for (let i = 0; i < n * 0.4; i++) {
        let t = map(i, 0, n * 0.4, 0, TWO_PI);
        let sc = 10;
        let hx = cx + sc * 16 * pow(sin(t), 3);
        let hy = cy - sc * (13 * cos(t) - 5 * cos(2*t) - 2 * cos(3*t) - cos(4*t));
        pts.push({ x: hx, y: hy });
    }
    return shuffleArr(pts);
}

function buildLiminalTargets(n) {
    let pts = [];
    const og = document.createElement('canvas');
    og.width = width; og.height = height;
    const octx = og.getContext('2d');
    octx.fillStyle = '#fff';
    octx.font = `bold ${Math.floor(width / 5)}px "Courier New"`;
    octx.fillText("Bairan", (width - octx.measureText("Bairan").width) / 2, height * 0.45);
    octx.font = `bold ${Math.floor(width / 10)}px "Courier New"`;
    octx.fillText("LIN", (width - octx.measureText("LIN").width) / 2, height * 0.65);

    const imgData = octx.getImageData(0, 0, width, height).data;
    for (let x = 0; x < width; x += 6) {
        for (let y = 0; y < height; y += 6) {
            if (imgData[(x + y * width) * 4] > 128) pts.push({ x, y });
        }
    }
    while (pts.length < n) pts.push({ x: random(width), y: random(height) });
    return shuffleArr(pts).slice(0, n);
}

function shuffleArr(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function respawnParticles() {
    if (!targetsReady) return;
    particles = [];
    for (let i = 0; i < NUM_PARTICLES; i++) {
        particles.push(new Particle(random(width), random(height), i));
    }
}

// ─── MediaPipe 核心 ──────────────────────────────────────────────
function initMediaPipe() {
    const handsModel = new Hands({
        locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });
    handsModel.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

    handsModel.onResults(results => {
        document.getElementById('loading-overlay').style.display = 'none';
        if (!targetsReady) buildTargets();

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            isHandVisible = true;
            const lm = results.multiHandLandmarks[0];
            handX = (1 - lm[0].x) * width;
            handY = lm[0].y * height;

            // 握拳判斷
            let fold = 0;
            const tips = [8, 12, 16, 20], mcps = [5, 9, 13, 17];
            for (let i = 0; i < 4; i++) if (lm[tips[i]].y > lm[mcps[i]].y) fold++;
            isFist = fold >= 3;

            // 彈指判斷 (Thumb 4 & Index 8)
            let d = dist(lm[4].x, lm[4].y, lm[8].x, lm[8].y);
            if (prevPinchDist < 0.04 && d > 0.1) snapDetected = true;
            prevPinchDist = d;

            // 五指併攏清除
            let spread = dist(lm[8].x, lm[8].y, lm[12].x, lm[12].y) + dist(lm[16].x, lm[16].y, lm[20].x, lm[20].y);
            if (spread < 0.05) trail = [];
        } else {
            isHandVisible = false;
        }
    });

    async function loop() {
        if (video.elt.readyState >= 2) await handsModel.send({ image: video.elt });
        requestAnimationFrame(loop);
    }
    loop();
}

// ─── 繪製循環 ────────────────────────────────────────────────────
function draw() {
    background(0);

    // 背景相機
    push();
    translate(width, 0); scale(-1, 1);
    tint(255, 180);
    image(video, 0, 0, width, height);
    fill(MODE_INFO[mode].bg[0], MODE_INFO[mode].bg[1], MODE_INFO[mode].bg[2], MODE_INFO[mode].bg[3]);
    rect(0, 0, width, height);
    pop();

    // 處理筆跡
    if (isHandVisible && !isFist && !showCard) {
        trail.push({ x: handX, y: handY });
        if (trail.length > 300) trail.shift();
    }
    noStroke();
    fill(0, 255, 200, 150);
    for (let p of trail) ellipse(p.x, p.y, 4, 4);

    // 處理彈指
    if (snapDetected) {
        showCard = true;
        cardTimer = 180;
        snapDetected = false;
    }

    if (showCard) {
        drawVIPCard();
    } else if (targetsReady) {
        const targets = mode === 0 ? roseTargets : liminalTargets;
        for (let i = 0; i < particles.length; i++) {
            particles[i].update(targets[i], isFist, handX, handY);
            particles[i].draw();
        }
    }

    // 手勢提示
    if (isHandVisible) {
        noFill(); stroke(isFist ? 'red' : '#0ff');
        ellipse(handX, handY, isFist ? 40 : 70);
    }
}

function drawVIPCard() {
    push();
    translate(width/2, height/2);
    rotate(sin(frameCount * 0.05) * 0.05);
    fill(20, 20, 30, 230); stroke(0, 255, 200); strokeWeight(3);
    rectMode(CENTER); rect(0, 0, 300, 160, 20);
    noStroke(); fill(0, 255, 200); textAlign(CENTER, CENTER);
    textSize(30); text("V I P", 0, -30);
    textSize(16); fill(255); text("Bairan Lin", 0, 10);
    textSize(10); fill(0, 255, 200, 150); text("SPECIAL ACCESS GRANTED", 0, 45);
    pop();
    if (--cardTimer <= 0) showCard = false;
}

// ─── 粒子類別 ───────────────────────────────────────────────
class Particle {
    constructor(x, y, idx) {
        this.pos = createVector(x, y);
        this.vel = createVector(random(-2, 2), random(-2, 2));
        this.acc = createVector(0, 0);
        this.idx = idx;
    }
    update(target, fist, hx, hy) {
        this.acc.set(0, 0);
        if (fist) {
            let steer = p5.Vector.sub(createVector(target.x, target.y), this.pos);
            let d = steer.mag();
            steer.setMag(d < 50 ? map(d, 0, 50, 0, 8) : 8);
            this.acc.add(p5.Vector.sub(steer, this.vel).limit(0.8));
        } else {
            if (isHandVisible) {
                let flee = p5.Vector.sub(this.pos, createVector(hx, hy));
                if (flee.mag() < 150) this.acc.add(flee.setMag(5));
            }
            this.acc.add(p5.Vector.random2D().mult(0.5));
        }
        this.vel.add(this.acc).limit(fist ? 10 : 4);
        this.pos.add(this.vel);
    }
    draw() {
        const info = MODE_INFO[mode];
        fill(info.glow[0], info.glow[1], info.glow[2], 50);
        ellipse(this.pos.x, this.pos.y, 8);
        fill(info.core[0], info.core[1], info.core[2]);
        ellipse(this.pos.x, this.pos.y, 3);
    }
}

function windowResized() { resizeCanvas(windowWidth, windowHeight); if (targetsReady) buildTargets(); }
</script>
</body>
</html>
